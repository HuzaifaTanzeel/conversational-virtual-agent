services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - livekit

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../.env
    ports:
      - "5173:80"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    env_file:
      - ../.env
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  livekit:
    image: livekit/livekit-server:latest
    env_file:
      - ../.env
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  qdrant_data:
