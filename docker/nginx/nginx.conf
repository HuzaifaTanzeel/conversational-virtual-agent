events {}

http {
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # Tavus calls {base_url}/chat/completions — rewrite to our RAG endpoint
        location /chat/completions {
            proxy_pass http://backend/llm/chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Direct SSE endpoint access
        location /llm/ {
            proxy_pass http://backend/llm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        location /session/ {
            proxy_pass http://backend/session/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /tools/ {
            proxy_pass http://backend/tools/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rag/ {
            proxy_pass http://backend/rag/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        # Legacy /api/ prefix fallthrough
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
